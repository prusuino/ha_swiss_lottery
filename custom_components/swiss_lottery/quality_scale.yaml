rules:
  # Bronze
  action-setup:
    status: exempt
    comment: The integration has no actions.
  appropriate-polling:
    status: done
    comment: One request per hour for all games together; results appear within the hour after a draw.
  brands: done
  common-modules:
    status: done
    comment: coordinator.py, device.py, swisslos.py (parser) and tickets.py hold the shared pieces.
  config-flow: done
  config-flow-test-coverage: done
  dependency-transparency:
    status: done
    comment: No requirements beyond Home Assistant's own aiohttp; the page is parsed with the standard library.
  docs-actions:
    status: exempt
    comment: No actions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  entity-event-setup:
    status: done
    comment: Entities subscribe to the shared coordinator in async_added_to_hass.
  entity-unique-id: done
  has-entity-name: done
  runtime-data:
    status: done
    comment: Each entry's runtime_data is the shared coordinator.
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions:
    status: exempt
    comment: No actions.
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: todo
  reauthentication-flow:
    status: exempt
    comment: The public results page needs no credentials.
  test-coverage: todo

  # Gold
  devices: done
  diagnostics: done
  discovery:
    status: exempt
    comment: A web page, nothing on the network to discover.
  discovery-update-info:
    status: exempt
    comment: No discovery.
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices:
    status: exempt
    comment: No devices.
  docs-supported-functions: done
  docs-troubleshooting: todo
  docs-use-cases: done
  dynamic-devices:
    status: exempt
    comment: One device per game.
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default: todo
  entity-translations: todo
  exception-translations: todo
  icon-translations: done
  reconfiguration-flow:
    status: exempt
    comment: An entry is one game; the tickets are options.
  repair-issues: done
  stale-devices:
    status: exempt
    comment: One device per game.

  # Platinum
  async-dependency: done
  inject-websession: done
  strict-typing: todo
